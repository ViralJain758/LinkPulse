# Optional: an offline local Postgres. LinkPulse's database is Supabase (see the README); use this only
# without internet access or to try things out.
# Create the tables afterwards with `cd server && npm run migrate`.
# Local development database only. Do not use these credentials in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
