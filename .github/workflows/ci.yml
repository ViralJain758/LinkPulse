name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Server syntax check
        working-directory: server
        run: npm ci && find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Client build
        working-directory: client
        run: npm ci && npm run build
  database:
    # Migrations must apply cleanly from empty, roll back, and re-apply; the auth queries depend on the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: linkpulse }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Migrate up, down (every migration), and up again
        working-directory: server
        run: |
          npm run migrate
          npm run migrate:down -- all
          npm run migrate
      - name: Rate limiter tests against Postgres
        working-directory: server
        run: node --test test/rateLimit.db.test.js
      - name: Session and token SQL smoke test
        working-directory: server
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/auth_smoke.sql
