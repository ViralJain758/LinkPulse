name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Server syntax check
        working-directory: server
        run: npm ci && find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Client tests and build
        working-directory: client
        run: npm ci && npm test && npm run build && grep -q 'Content-Security-Policy' dist/index.html
  docker:
    # The server image must build and start, and its health endpoints must behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t linkpulse-server server
      - name: Container starts; liveness is up and readiness reports the unreachable database as 503
        run: |
          docker run -d --name lp -p 4000:4000 -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x -e JWT_SECRET=ci-only-secret-ci-only-secret linkpulse-server
          for i in $(seq 1 20); do curl --fail --silent localhost:4000/health/live && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/health)" = 503
          docker rm -f lp
  database:
    # Migrations must apply cleanly from empty, roll back, and re-apply; the auth queries depend on the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: linkpulse }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Migrate up, down (every migration), and up again
        working-directory: server
        run: |
          npm run migrate
          npm run migrate:down -- all
          npm run migrate
      - name: Rate limiter, moderation and retention tests against Postgres
        working-directory: server
        run: node --test test/rateLimit.db.test.js test/moderation.test.js test/clickRetention.test.js
      - name: Session and token SQL smoke test
        working-directory: server
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/auth_smoke.sql
