name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Server syntax check
        working-directory: server
        run: npm ci && find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Client build
        working-directory: client
        run: npm ci && npm run build
  database:
    # The schema is meant to be re-run on existing databases, and the auth queries depend on it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: linkpulse }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema, then apply it again (must be re-runnable)
        working-directory: server
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - name: Rate limiter tests against Postgres
        working-directory: server
        run: npm ci && node --test test/rateLimit.db.test.js
      - name: Session and token SQL smoke test
        working-directory: server
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/auth_smoke.sql
